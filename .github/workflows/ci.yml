name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build documentation
        run: make docs PYTHON=python

  minimum-dependencies:
    name: Minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared minimum dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.26.0" \
            "scipy==1.12.0" \
            "matplotlib==3.8.0"
          python -m pip install --no-deps -e .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests against minimum dependencies
        run: python -m unittest discover -s tests -v

  installation:
    name: Offline bundle installation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and test the offline bundle
        run: python tests/script_test_install.py

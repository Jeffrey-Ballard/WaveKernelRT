[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "wavekernelrt"
version = "0.1.0"
description = "Real-time acoustic array processing framework"
readme = "README.md"
authors = [
    { name = "Jeffrey Ballard" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "acoustic arrays",
    "beamforming",
    "signal processing",
    "sonar",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/Jeffrey-Ballard/WaveKernelRT"
Documentation = "https://github.com/Jeffrey-Ballard/WaveKernelRT/tree/main/docs"
Repository = "https://github.com/Jeffrey-Ballard/WaveKernelRT"
Issues = "https://github.com/Jeffrey-Ballard/WaveKernelRT/issues"

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "pymdown-extensions",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

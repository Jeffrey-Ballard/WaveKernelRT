site_name: WaveKernelRT
site_description: Real-time acoustic array processing framework

docs_dir: docs
site_dir: site

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Getting started:
      - Installation and quick start: getting-started/installation.md
      - Offline installation: getting-started/offline-installation.md
  - Concepts:
      - Conventions: concepts/conventions.md
      - Data shapes and naming: concepts/data-shapes.md
      - Pipeline architecture: concepts/pipeline-architecture.md
      - Geometry and steering: concepts/geometry-and-steering.md
      - Shading and beampatterns: concepts/shading-and-beampatterns.md
      - Spectral processing: concepts/spectral-processing.md
      - Spectral normalization: concepts/spectral-normalization.md
      - Beamforming: concepts/beamforming.md
      - Band-energy detection: concepts/band-energy-detection.md
  - Examples:
      - Overview: examples/index.md
      - Basic arrays: examples/basic-arrays.md
      - SWellEx-96: examples/swellex96.md
  - Guides:
      - Plotting and visualization: guides/plotting.md
  - Reference:
      - Public API overview: reference/public-api.md
      - Array-analysis API: reference/api/array-analysis.md
      - Plotting API: reference/api/plotting.md
      - Pipeline API: reference/api/pipeline.md
      - Configuration: reference/configuration.md
      - Binary file formats: reference/file-formats.md
      - Algorithm references: references.md
  - Development:
      - Contributing and repository structure: development/contributing.md
      - Dependency and packaging policy: development/dependencies.md
      - Testing: development/testing.md
      - Writing documentation: development/documentation.md
      - Releases: development/releases.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
